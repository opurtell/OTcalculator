name: Deploy

# Every push to main goes live, but only through the tests. A failing test
# blocks the deploy — IMPLEMENTATION_PLAN.md §4.6. Pull requests build and test
# without deploying, so a broken branch is caught before it is merged.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Check the build is actually servable
        # Both of these fail silently at runtime rather than at build time, and
        # they produce near-identical symptoms — a page that loads but shows
        # nothing usable — so neither is safe to leave to a manual glance.
        run: |
          # base: '/' slipping out of vite.config.ts gives a blank page and a
          # 404 on every asset once Pages serves from the subpath.
          grep -q '/OTcalculator/assets/' dist/index.html \
            || { echo "dist/index.html has no /OTcalculator/ asset URLs — check base in vite.config.ts"; exit 1; }
          # The stylesheet is reachable only through an explicit import in
          # src/main.tsx: package.json's sideEffects field lets Rollup drop the
          # barrel's CSS import, which ships the app unstyled.
          test -n "$(find dist/assets -name '*.css' -print -quit)" \
            || { echo "no CSS in dist/assets — check the stylesheet import in src/main.tsx"; exit 1; }
          grep -q 'stylesheet' dist/index.html \
            || { echo "dist/index.html does not link a stylesheet"; exit 1; }
          # Offline support fails the same silent way: the app still loads over
          # the network, so nothing looks wrong until someone opens it in a
          # basement. The worker's precache list must carry subpath URLs for
          # the same reason index.html must.
          test -f dist/sw.js || { echo "no dist/sw.js — check the pwa() plugin in vite.config.ts"; exit 1; }
          grep -q '"/OTcalculator/assets/' dist/sw.js \
            || { echo "dist/sw.js precache list has no /OTcalculator/ URLs — check base handling in vite-pwa.ts"; exit 1; }
          for asset in manifest.webmanifest icon-192.png icon-512.png apple-touch-icon.png; do
            test -f "dist/$asset" \
              || { echo "dist/$asset missing — run 'node scripts/make-icons.mjs' and commit public/"; exit 1; }
          done

      - name: Upload the Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to Pages
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
